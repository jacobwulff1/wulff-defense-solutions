<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIBERTY HEIST — Open World</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0a0a0f; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
  #game { display: block; width: 100vw; height: 100vh; background: #2b2f36; cursor: crosshair; }
  .hud { position: fixed; color: #fff; pointer-events: none; text-shadow: 0 2px 6px #000; }
  #topleft { top: 14px; left: 16px; font-size: 15px; line-height: 1.7; }
  #topleft b { font-weight: 700; }
  #stars { color: #ffd23f; letter-spacing: 2px; font-size: 20px; min-height: 24px; }
  #score { font-size: 26px; font-weight: 800; font-family: 'Space Grotesk', monospace; }
  #speed { position: fixed; bottom: 18px; right: 22px; color: #fff; text-align: right; text-shadow: 0 2px 6px #000; }
  #speed .n { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #speed .u { font-size: 13px; opacity: .7; letter-spacing: 2px; }
  #minimap { position: fixed; bottom: 16px; left: 16px; border: 3px solid rgba(255,255,255,.25); border-radius: 8px; box-shadow: 0 8px 30px rgba(0,0,0,.6); }
  #msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #fff;
         font-size: 22px; font-weight: 700; text-align: center; text-shadow: 0 3px 10px #000;
         background: rgba(10,10,20,.6); padding: 10px 22px; border-radius: 10px; opacity: 0; transition: opacity .3s; }
  #help { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); color: #cfd3da;
          font-size: 12px; letter-spacing: .4px; background: rgba(0,0,0,.4); padding: 7px 16px; border-radius: 20px; pointer-events:none; }
  #banner { position: fixed; top: 0; left: 0; right: 0; text-align: center; padding: 6px;
            font-size: 11px; letter-spacing: 2px; color: #8a90a0; background: rgba(0,0,0,.35); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="banner">LIBERTY HEIST · a top-down open-world game · not affiliated with Rockstar / GTA</div>
<div class="hud" id="topleft">
  <div id="score">$0</div>
  <div id="stars"></div>
  <div id="status" style="font-size:13px;opacity:.85"></div>
</div>
<div class="hud" id="speed"><span class="n" id="kmh">0</span> <span class="u">KM/H</span></div>
<canvas id="minimap" width="170" height="170"></canvas>
<div class="hud" id="msg"></div>
<div id="help">WASD / Arrows — drive &nbsp;·&nbsp; SPACE — handbrake &nbsp;·&nbsp; E — steal nearest car &nbsp;·&nbsp; mind the pedestrians</div>

<script>
(() => {
  "use strict";
  const cv = document.getElementById('game'), ctx = cv.getContext('2d');
  const mm = document.getElementById('minimap'), mmx = mm.getContext('2d');
  let W = 0, H = 0;
  function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
  addEventListener('resize', resize); resize();

  // ---------- World generation ----------
  const TILE = 220;                 // city block size (px)
  const ROAD = 64;                  // road width
  const GRID = 26;                  // blocks per side
  const WORLD = GRID * TILE;
  const rng = mulberry32(1337);
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

  // buildings: one rect per block, inset from roads
  const buildings = [];
  const blockColors = ['#3a3f48','#41454f','#363b44','#454a55','#3d424c','#4a4039','#394044'];
  for (let gy=0; gy<GRID; gy++) for (let gx=0; gx<GRID; gx++){
    const bx = gx*TILE + ROAD/2, by = gy*TILE + ROAD/2;
    const pad = ROAD/2 + 6;
    // subdivide some blocks into 2-4 buildings for variety
    const parts = 1 + (rng()<.5?1:0) + (rng()<.3?1:0);
    const innerW = TILE-ROAD-12, innerH = TILE-ROAD-12;
    if (parts === 1){
      buildings.push(mkB(bx+pad, by+pad, innerW, innerH));
    } else {
      const splitV = rng()<.5;
      if (splitV){
        const w1 = innerW*(0.35+rng()*0.3);
        buildings.push(mkB(bx+pad, by+pad, w1-6, innerH));
        buildings.push(mkB(bx+pad+w1+6, by+pad, innerW-w1-6, innerH));
      } else {
        const h1 = innerH*(0.35+rng()*0.3);
        buildings.push(mkB(bx+pad, by+pad, innerW, h1-6));
        buildings.push(mkB(bx+pad, by+pad+h1+6, innerW, innerH-h1-6));
      }
    }
  }
  function mkB(x,y,w,h){
    return { x, y, w, h, c: blockColors[(rng()*blockColors.length)|0],
             roof: rng()<.5 ? '#2c3038' : '#33373f', lit: rng()<.4 };
  }

  // a central park (green block) for landmark flavor
  const park = { x: (GRID>>1)*TILE, y: (GRID>>1)*TILE, w: TILE*2, h: TILE*2 };

  function onRoad(x,y){
    const mx = ((x%TILE)+TILE)%TILE, my = ((y%TILE)+TILE)%TILE;
    return mx < ROAD || my < ROAD;
  }

  // ---------- Entities ----------
  function makeCar(x,y,opts={}){
    return Object.assign({
      x, y, angle: -Math.PI/2, speed: 0,
      w: 30, h: 54, color: opts.color || pick(['#d23','#2a7','#27d','#fb3','#b3f','#0cc','#f70','#eee','#555']),
      steer: 0, isPlayerControlled:false, npc: opts.npc||false,
      // npc waypoint driving
      dir: opts.dir||0, targetSpeed: opts.targetSpeed||0, hp: 100
    }, opts);
  }
  function pick(a){ return a[(Math.random()*a.length)|0]; }

  // player starts at a road intersection near center
  const startX = (GRID>>1)*TILE + ROAD/2;
  const startY = (GRID>>1)*TILE - TILE*3 + ROAD/2;
  let player = makeCar(startX, startY, { color:'#e8e8ee', isPlayerControlled:true });
  let onFoot = false, footX = player.x, footY = player.y, footAngle = -Math.PI/2;

  // traffic
  const traffic = [];
  for (let i=0;i<70;i++){
    const horiz = Math.random()<.5;
    const lane = ((Math.random()*GRID)|0)*TILE + ROAD*0.25;
    const along = Math.random()*WORLD;
    const c = makeCar(horiz?along:lane, horiz?lane:along, { npc:true, color: pick(['#c33','#39c','#3c6','#ec3','#999','#c6c','#e80']) });
    c.angle = horiz ? (Math.random()<.5?0:Math.PI) : (Math.random()<.5?Math.PI/2:-Math.PI/2);
    c.targetSpeed = 2.2 + Math.random()*1.6;
    c.speed = c.targetSpeed;
    traffic.push(c);
  }

  // pedestrians
  const peds = [];
  for (let i=0;i<120;i++){
    peds.push(spawnPed(Math.random()*WORLD, Math.random()*WORLD));
  }
  function spawnPed(x,y){
    return { x, y, angle: Math.random()*7, speed: .35+Math.random()*.5,
             color: pick(['#e8c39e','#caa472','#8d5a3b','#f0d0b0']),
             shirt: pick(['#36c','#c33','#3a6','#444','#e90','#90c','#0aa']),
             alive:true, panic:0, t: Math.random()*100 };
  }

  // police
  const police = [];

  // particles (blood, smoke, sparks)
  const fx = [];
  function burst(x,y,color,n,spd){ for(let i=0;i<n;i++){ const a=Math.random()*7; fx.push({x,y,vx:Math.cos(a)*spd*Math.random(),vy:Math.sin(a)*spd*Math.random(),life:1,color,r:1+Math.random()*2}); } }

  // ---------- Input ----------
  const keys = {};
  addEventListener('keydown', e=>{ keys[e.key.toLowerCase()]=true; if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault(); if(e.key.toLowerCase()==='e') tryEnterExit(); });
  addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; });

  // ---------- State ----------
  let score = 0, wanted = 0, wantedDecay = 0, killed = 0;
  let cam = { x: player.x, y: player.y };
  const msgEl = document.getElementById('msg');
  let msgTimer = 0;
  function flash(t, ms=1400){ msgEl.textContent=t; msgEl.style.opacity=1; msgTimer=ms; }

  function addScore(n){ score += n; }
  function setWanted(w){ wanted = Math.max(wanted, Math.min(5, w)); wantedDecay = 9000; }

  // ---------- Enter/exit vehicle ----------
  function tryEnterExit(){
    if (onFoot){
      // find nearest car within range
      let best=null, bd=70*70;
      for(const c of traffic){ const d=(c.x-footX)**2+(c.y-footY)**2; if(d<bd){bd=d;best=c;} }
      for(const c of police){ const d=(c.x-footX)**2+(c.y-footY)**2; if(d<bd){bd=d;best=c;} }
      if(best){
        // carjack
        if(best.npc && !best.stolen){ addScore(50); flash('+$50  Grand Theft Auto', 1100); setWanted(Math.max(wanted,2)); }
        if(best.police){ setWanted(Math.max(wanted,3)); flash('Stole a police cruiser!',1100); }
        // remove from npc/police pools, promote to player
        const ti=traffic.indexOf(best); if(ti>=0)traffic.splice(ti,1);
        const pi=police.indexOf(best); if(pi>=0)police.splice(pi,1);
        player = best; player.isPlayerControlled=true; player.npc=false; player.police=false;
        player.angle = footAngle; onFoot=false;
      } else { flash('No car nearby',700); }
    } else {
      // exit current car: becomes an abandoned vehicle
      onFoot=true; footX=player.x+Math.cos(player.angle+1.5)*34; footY=player.y+Math.sin(player.angle+1.5)*34; footAngle=player.angle;
      const abandoned = player; abandoned.isPlayerControlled=false; abandoned.npc=true; abandoned.stolen=true; abandoned.speed=0; abandoned.targetSpeed=0;
      traffic.push(abandoned);
    }
  }

  // ---------- Physics helpers ----------
  function collideBuildings(ent, r){
    for(const b of buildings){
      if(ent.x > b.x-r && ent.x < b.x+b.w+r && ent.y > b.y-r && ent.y < b.y+b.h+r){
        // push out along smallest overlap
        const dl = ent.x-(b.x-r), dr=(b.x+b.w+r)-ent.x, dt=ent.y-(b.y-r), db=(b.y+b.h+r)-ent.y;
        const m = Math.min(dl,dr,dt,db);
        if(m===dl)ent.x=b.x-r; else if(m===dr)ent.x=b.x+b.w+r; else if(m===dt)ent.y=b.y-r; else ent.y=b.y+b.h+r;
        return true;
      }
    }
    return false;
  }

  // ---------- Update ----------
  let last = performance.now();
  function update(dt){
    // ---- control ----
    if(onFoot){
      let mvx=0,mvy=0;
      if(keys['w']||keys['arrowup'])mvy-=1;
      if(keys['s']||keys['arrowdown'])mvy+=1;
      if(keys['a']||keys['arrowleft'])mvx-=1;
      if(keys['d']||keys['arrowright'])mvx+=1;
      if(mvx||mvy){ const l=Math.hypot(mvx,mvy); footX+=mvx/l*2.4; footY+=mvy/l*2.4; footAngle=Math.atan2(mvy,mvx); }
      collideBuildings({get x(){return footX;},set x(v){footX=v;},get y(){return footY;},set y(v){footY=v;}}, 10);
      cam.tx=footX; cam.ty=footY;
    } else {
      const p=player;
      const accel = (keys['w']||keys['arrowup'])?0.22:0;
      const brake = (keys['s']||keys['arrowdown'])?0.30:0;
      const hand = (keys[' ']);
      p.speed += accel; p.speed -= brake;
      p.speed *= hand?0.90:0.985;            // drag / handbrake
      p.speed = Math.max(-3.5, Math.min(8.5, p.speed));
      let steerInput=0;
      if(keys['a']||keys['arrowleft'])steerInput-=1;
      if(keys['d']||keys['arrowright'])steerInput+=1;
      const grip = hand?0.045:0.032;
      p.angle += steerInput * grip * Math.sign(p.speed) * Math.min(1, Math.abs(p.speed)/2);
      const nx = p.x + Math.cos(p.angle)*p.speed*2.2;
      const ny = p.y + Math.sin(p.angle)*p.speed*2.2;
      p.x=nx; p.y=ny;
      if(collideBuildings(p, 18)){ p.speed*=-0.3; burst(p.x,p.y,'#ff0',6,3); }
      cam.tx=p.x; cam.ty=p.y;
    }
    // world wrap clamp
    const C = (v)=>Math.max(40, Math.min(WORLD-40, v));
    if(onFoot){footX=C(footX);footY=C(footY);} else {player.x=C(player.x);player.y=C(player.y);}

    // smooth camera
    cam.x += (cam.tx-cam.x)*0.10; cam.y += (cam.ty-cam.y)*0.10;

    // ---- traffic AI ----
    for(const c of traffic){
      if(c.stolen){ c.speed*=0.9; continue; }
      // follow current heading, turn at intersections occasionally
      c.speed += (c.targetSpeed - c.speed)*0.04;
      const nx=c.x+Math.cos(c.angle)*c.speed*2.2, ny=c.y+Math.sin(c.angle)*c.speed*2.2;
      if(onRoad(nx,ny)){ c.x=nx; c.y=ny; }
      else { c.angle += (Math.random()<.5?1:-1)*Math.PI/2; } // turn to stay on grid
      // random turns at intersections
      const mx=((c.x%TILE)+TILE)%TILE, my=((c.y%TILE)+TILE)%TILE;
      if(mx<6 && my<6 && Math.random()<0.04){ c.angle += (Math.random()<.5?1:-1)*Math.PI/2; }
      wrap(c);
      // run over peds
    }

    // ---- pedestrians ----
    const px = onFoot?footX:player.x, py = onFoot?footY:player.y;
    const pspeed = onFoot?2.4:Math.abs(player.speed);
    for(const pd of peds){
      if(!pd.alive){ continue; }
      pd.t += dt*0.001;
      const ddx = pd.x-px, ddy=pd.y-py, dist=Math.hypot(ddx,ddy);
      if(dist < 220 && (!onFoot) && pspeed>1){ pd.panic=1; }
      if(pd.panic>0){
        pd.panic-=0.004;
        pd.angle = Math.atan2(ddy,ddx);
        pd.x += Math.cos(pd.angle)*1.6; pd.y += Math.sin(pd.angle)*1.6;
      } else {
        // wander
        if(Math.random()<0.01) pd.angle += (Math.random()-0.5)*1.5;
        pd.x += Math.cos(pd.angle)*pd.speed; pd.y += Math.sin(pd.angle)*pd.speed;
      }
      // roadkill
      const carHit = !onFoot && dist<26 && pspeed>1.5;
      if(carHit){
        pd.alive=false; burst(pd.x,pd.y,'#a00',16,4); killed++;
        addScore(-25); setWanted(Math.max(wanted, pspeed>4?3:2));
        flash('Hit and run!  -$25', 900);
        setTimeout(()=>{ const i=peds.indexOf(pd); if(i>=0)peds[i]=spawnPed(Math.random()*WORLD,Math.random()*WORLD); }, 4000);
      }
      pd.x=C(pd.x); pd.y=C(pd.y);
    }

    // ---- wanted system & police ----
    if(wanted>0){
      wantedDecay -= dt;
      if(wantedDecay<=0){ wanted=Math.max(0,wanted-1); wantedDecay=8000; }
      // spawn police up to count = wanted
      const want = wanted;
      while(police.length < want){
        const ang=Math.random()*7, dd=600+Math.random()*300;
        const c=makeCar(px+Math.cos(ang)*dd, py+Math.sin(ang)*dd, {police:true, color:'#1a2a6c'});
        c.speed=4; police.push(c);
      }
      while(police.length > Math.max(0,want)) { police.pop(); }
    } else {
      police.length=0;
    }
    for(const c of police){
      const ang=Math.atan2(py-c.y, px-c.x);
      let da=((ang-c.angle+Math.PI*3)%(Math.PI*2))-Math.PI;
      c.angle += Math.max(-0.06,Math.min(0.06,da));
      c.speed += (5.5+wanted*0.4 - c.speed)*0.05;
      const nx=c.x+Math.cos(c.angle)*c.speed*2.2, ny=c.y+Math.sin(c.angle)*c.speed*2.2;
      c.x=nx;c.y=ny; collideBuildings(c,18);
      const d=Math.hypot(c.x-px,c.y-py);
      if(d<34){ // bust / ram
        if(onFoot){ flash('BUSTED!  Wanted level cleared', 1600); wanted=0; police.length=0; addScore(-100); footX+=Math.cos(ang+Math.PI)*60; footY+=Math.sin(ang+Math.PI)*60; }
        else { player.speed*=-0.4; c.speed*=-0.4; burst((c.x+px)/2,(c.y+py)/2,'#fff',8,3); }
      }
      c.flash = (performance.now()/120|0)%2;
    }

    // ---- particles ----
    for(let i=fx.length-1;i>=0;i--){ const p=fx[i]; p.x+=p.vx; p.y+=p.vy; p.vx*=0.92; p.vy*=0.92; p.life-=0.02; if(p.life<=0)fx.splice(i,1); }

    // ---- survival score ----
    addScore(dt*0.001*2); // small income for staying alive / exploring

    function wrap(c){ if(c.x<0)c.x+=WORLD; if(c.x>WORLD)c.x-=WORLD; if(c.y<0)c.y+=WORLD; if(c.y>WORLD)c.y-=WORLD; }
  }

  // ---------- Render ----------
  function carSprite(c){
    ctx.save();
    ctx.translate(c.x-cam.x+W/2, c.y-cam.y+H/2);
    ctx.rotate(c.angle+Math.PI/2);
    // shadow
    ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(-c.w/2+3, -c.h/2+4, c.w, c.h);
    // body
    ctx.fillStyle=c.color; roundRect(-c.w/2,-c.h/2,c.w,c.h,6); ctx.fill();
    // windshield
    ctx.fillStyle='rgba(20,30,45,.85)'; roundRect(-c.w/2+5,-c.h/2+8,c.w-10,12,3); ctx.fill();
    roundRect(-c.w/2+5,c.h/2-20,c.w-10,10,3); ctx.fill();
    // police lights
    if(c.police){ ctx.fillStyle=c.flash?'#f33':'#33f'; ctx.fillRect(-8,-3,7,6); ctx.fillStyle=c.flash?'#33f':'#f33'; ctx.fillRect(1,-3,7,6); }
    ctx.restore();
  }
  function pedSprite(pd){
    if(!pd.alive){ ctx.fillStyle='rgba(120,0,0,.5)'; ctx.beginPath(); ctx.ellipse(pd.x-cam.x+W/2,pd.y-cam.y+H/2,12,8,0,0,7); ctx.fill(); return; }
    const sx=pd.x-cam.x+W/2, sy=pd.y-cam.y+H/2;
    ctx.fillStyle='rgba(0,0,0,.3)'; ctx.beginPath(); ctx.arc(sx+2,sy+3,7,0,7); ctx.fill();
    ctx.fillStyle=pd.shirt; ctx.beginPath(); ctx.arc(sx,sy,7,0,7); ctx.fill();
    ctx.fillStyle=pd.color; ctx.beginPath(); ctx.arc(sx,sy,4,0,7); ctx.fill();
  }
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  function render(){
    // ground
    ctx.fillStyle='#22262c'; ctx.fillRect(0,0,W,H);
    const ox=W/2-cam.x, oy=H/2-cam.y;
    // visible block range
    const minGX=Math.max(0,((cam.x-W/2)/TILE|0)-1), maxGX=Math.min(GRID,((cam.x+W/2)/TILE|0)+2);
    const minGY=Math.max(0,((cam.y-H/2)/TILE|0)-1), maxGY=Math.min(GRID,((cam.y+H/2)/TILE|0)+2);
    // roads (draw block grass + asphalt)
    for(let gy=minGY;gy<maxGY;gy++)for(let gx=minGX;gx<maxGX;gx++){
      const X=gx*TILE+ox, Y=gy*TILE+oy;
      ctx.fillStyle='#3b3f46'; ctx.fillRect(X,Y,ROAD,TILE); ctx.fillRect(X,Y,TILE,ROAD); // asphalt cross
      // lane dashes
      ctx.strokeStyle='rgba(255,220,120,.5)'; ctx.lineWidth=2; ctx.setLineDash([14,16]);
      ctx.beginPath(); ctx.moveTo(X+ROAD/2,Y); ctx.lineTo(X+ROAD/2,Y+TILE); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(X,Y+ROAD/2); ctx.lineTo(X+TILE,Y+ROAD/2); ctx.stroke();
      ctx.setLineDash([]);
    }
    // park
    ctx.fillStyle='#2f5d3a'; ctx.fillRect(park.x+ox, park.y+oy, park.w, park.h);
    // buildings
    for(const b of buildings){
      const X=b.x+ox, Y=b.y+oy;
      if(X>W||Y>H||X+b.w<0||Y+b.h<0)continue;
      ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(X+5,Y+6,b.w,b.h);
      ctx.fillStyle=b.c; ctx.fillRect(X,Y,b.w,b.h);
      ctx.fillStyle=b.roof; ctx.fillRect(X+4,Y+4,b.w-8,b.h-8);
      if(b.lit){ ctx.fillStyle='rgba(255,230,150,.10)'; for(let wy=Y+10;wy<Y+b.h-8;wy+=18)for(let wx=X+10;wx<X+b.w-8;wx+=18){ if((wx*wy)%7<3)ctx.fillRect(wx,wy,7,9); } }
    }
    // particles under cars
    for(const p of fx){ ctx.globalAlpha=p.life; ctx.fillStyle=p.color; ctx.fillRect(p.x+ox,p.y+oy,p.r,p.r); }
    ctx.globalAlpha=1;
    // peds
    for(const pd of peds)pedSprite(pd);
    // traffic
    for(const c of traffic)carSprite(c);
    // police
    for(const c of police)carSprite(c);
    // player
    if(onFoot){
      const sx=footX-cam.x+W/2, sy=footY-cam.y+H/2;
      ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(sx+2,sy+3,9,0,7); ctx.fill();
      ctx.fillStyle='#e8e8ee'; ctx.beginPath(); ctx.arc(sx,sy,9,0,7); ctx.fill();
      ctx.fillStyle='#d2a679'; ctx.beginPath(); ctx.arc(sx,sy,5,0,7); ctx.fill();
    } else { carSprite(player); }

    // vignette
    const g=ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.8);
    g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.45)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    renderMinimap();
    renderHUD();
  }

  function renderMinimap(){
    const s = mm.width/WORLD;
    mmx.fillStyle='#1a1d22'; mmx.fillRect(0,0,mm.width,mm.height);
    mmx.fillStyle='#2f5d3a'; mmx.fillRect(park.x*s,park.y*s,park.w*s,park.h*s);
    // road grid hint
    mmx.strokeStyle='rgba(90,100,120,.4)'; mmx.lineWidth=1;
    for(let i=0;i<=GRID;i+=2){ mmx.beginPath(); mmx.moveTo(i*TILE*s,0); mmx.lineTo(i*TILE*s,mm.height); mmx.stroke(); mmx.beginPath(); mmx.moveTo(0,i*TILE*s); mmx.lineTo(mm.width,i*TILE*s); mmx.stroke(); }
    // police dots
    mmx.fillStyle='#3b82f6'; for(const c of police){ mmx.fillRect(c.x*s-1,c.y*s-1,3,3); }
    // player
    const px=onFoot?footX:player.x, py=onFoot?footY:player.y;
    mmx.fillStyle='#fff'; mmx.beginPath(); mmx.arc(px*s,py*s,3,0,7); mmx.fill();
  }

  function renderHUD(){
    document.getElementById('score').textContent = '$'+Math.floor(score).toLocaleString();
    document.getElementById('stars').textContent = '★'.repeat(wanted)+'☆'.repeat(5-wanted);
    document.getElementById('kmh').textContent = onFoot?0:Math.abs(Math.round(player.speed*22));
    const st = onFoot ? 'ON FOOT — press E near a car' : (player.stolen?'':'') + (wanted>0?`POLICE PURSUIT (${police.length} units)`:'cruising');
    document.getElementById('status').textContent = st + `  ·  roadkill: ${killed}`;
    if(msgTimer>0){ msgTimer-=16; if(msgTimer<=0)msgEl.style.opacity=0; }
  }

  // ---------- Loop ----------
  flash('LIBERTY HEIST — drive, explore, cause chaos', 2600);
  function loop(now){
    const dt=Math.min(40, now-last); last=now;
    update(dt); render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
